name: Go management, storage, and Collector agent CI

on:
  pull_request:
    paths:
      - 'cmd/management/**'
      - 'cmd/collector-agent/**'
      - 'internal/**'
      - 'go.mod'
      - 'deploy/collector/Dockerfile'
      - 'deploy/management/**'
      - 'scripts/management-*.sh'
      - 'scripts/test-management-recovery.sh'
      - 'scripts/management-backup-postgres-encrypted.sh'
      - 'scripts/management-restore-postgres-encrypted.sh'
      - 'scripts/test-postgres-recovery.sh'
      - 'docs/operations-recovery.md'
      - 'README.md'
      - '.github/workflows/go-management-ci.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/management/**'
      - 'cmd/collector-agent/**'
      - 'internal/**'
      - 'go.mod'
      - 'deploy/collector/Dockerfile'
      - 'deploy/management/**'
      - '.github/workflows/go-management-ci.yml'

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: signalforge
          POSTGRES_PASSWORD: signalforge-ci-password
          POSTGRES_DB: signalforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalforge -d signalforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIGNALFORGE_TEST_POSTGRES_URL: postgres://signalforge:signalforge-ci-password@localhost:5432/signalforge_test?sslmode=disable
      SIGNALFORGE_TEST_POSTGRES_RESTORE_URL: postgres://signalforge:signalforge-ci-password@localhost:5432/signalforge_restore_test?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Resolve and verify module dependencies
        run: go mod tidy
      - name: Upload resolved Go checksums for reproducible builds
        uses: actions/upload-artifact@v4
        with:
          name: signalforge-go-sum
          path: |
            go.mod
            go.sum
          if-no-files-found: error
      - name: Run race-enabled unit and integration tests
        run: go test -race ./...
      - name: Run PostgreSQL integration tests
        run: go test -race ./internal/managementstore -run Postgres
      - name: Run static analysis
        run: go vet ./...
      - name: Test management SQLite backup and restore scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes sqlite3
          bash -n scripts/management-backup.sh scripts/management-restore.sh scripts/test-management-recovery.sh
          scripts/test-management-recovery.sh
      - name: Install PostgreSQL recovery test tools
        run: sudo apt-get update && sudo apt-get install --yes age postgresql-client
      - name: Create isolated PostgreSQL restore target
        env:
          PGPASSWORD: signalforge-ci-password
        run: createdb --host=127.0.0.1 --username=signalforge signalforge_restore_test
      - name: Test encrypted PostgreSQL backup and restore
        run: |
          bash -n scripts/management-backup-postgres-encrypted.sh scripts/management-restore-postgres-encrypted.sh scripts/test-postgres-recovery.sh
          scripts/test-postgres-recovery.sh
      - name: Build management container
        run: docker build --file deploy/management/Dockerfile --tag signalforge-management:ci .
      - name: Smoke-test management API and persistence across restart
        shell: bash
        run: |
          set -euo pipefail
          token='signalforge-ci-admin-token-0123456789abcdef0123456789'
          docker run --detach --name signalforge-management-ci \
            --publish 127.0.0.1:18081:8081 \
            --env SIGNALFORGE_ADMIN_TOKEN="$token" \
            signalforge-management:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then break; fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then
            echo "Management container failed initial startup."
            docker logs signalforge-management-ci || true
            docker inspect signalforge-management-ci || true
            exit 1
          fi
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $token" \
            --header 'Content-Type: application/json' \
            --data '{"tenant_id":"ci-persistence"}' \
            http://127.0.0.1:18081/api/v1/admin/tenants >/dev/null
          docker restart signalforge-management-ci >/dev/null
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then break; fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then
            echo "Management container failed to recover after restart."
            docker logs signalforge-management-ci || true
            docker inspect signalforge-management-ci || true
            exit 1
          fi
          if ! status=$(curl --silent --show-error --max-time 5 --output "$RUNNER_TEMP/duplicate-tenant.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" \
            --header 'Content-Type: application/json' \
            --data '{"tenant_id":"ci-persistence"}' \
            http://127.0.0.1:18081/api/v1/admin/tenants); then
            echo "Duplicate-tenant request could not reach the restarted service."
            docker logs signalforge-management-ci || true
            docker inspect signalforge-management-ci || true
            exit 1
          fi
          if [ "$status" != "409" ]; then
            cat "$RUNNER_TEMP/duplicate-tenant.json"
            echo "Expected persisted tenant to return HTTP 409 after restart; got $status."
            exit 1
          fi
          echo "Management health and durable SQLite state survived container restart."
      - name: Stop management smoke-test container
        if: always()
        run: docker rm --force signalforge-management-ci || true
