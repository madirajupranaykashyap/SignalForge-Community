name: Collector build and smoke test

on:
  pull_request:
    paths:
      - "collector/**"
      - "deploy/collector/**"
      - "cmd/management/**"
      - "internal/**"
      - "go.mod"
      - ".github/workflows/go-management-ci.yml"
      - ".github/workflows/collector-ci.yml"
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "deploy/collector/**"
      - "cmd/management/**"
      - "internal/**"
      - "go.mod"
      - ".github/workflows/go-management-ci.yml"
      - ".github/workflows/collector-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collector-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Resolve Go module dependencies
        run: go mod tidy

      - name: Test Go management and config client
        run: go test ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Validate Prometheus rules and Grafana dashboard
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --entrypoint promtool \
            --volume "$PWD/deploy/collector/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml.example

          docker run --rm \
            --entrypoint promtool \
            --volume "$PWD/deploy/collector/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check rules \
              /etc/prometheus/recording-rules.yml \
              /etc/prometheus/alerting-rules.yml

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("deploy/collector/grafana/signalforge-optimization-dashboard.json")
          dashboard = json.loads(path.read_text(encoding="utf-8"))
          assert dashboard.get("title") == "SignalForge Optimization"
          assert dashboard.get("uid") == "signalforge-optimization"
          panels = dashboard.get("panels")
          assert isinstance(panels, list) and len(panels) >= 4
          expressions = {
              target.get("expr")
              for panel in panels
              for target in panel.get("targets", [])
              if isinstance(target, dict)
          }
          expected = {
              "signalforge:input_log_records:rate5m",
              "signalforge:optimized_log_records:rate5m",
              "signalforge:log_record_reduction_percent:rate5m",
          }
          missing = expected - expressions
          if missing:
              raise SystemExit(f"Dashboard is missing expected recording-rule queries: {sorted(missing)}")
          print(f"Validated dashboard JSON and {len(panels)} panels.")
          PY

      - name: Test archive metrics and policy configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s deploy/collector/tests -v
          python3 -m py_compile deploy/collector/metrics/archive_metrics.py
          python3 - <<'PY'
          from pathlib import Path

          config = Path("collector/config/signalforge-collector.yaml").read_text()
          required = [
              '${env:SIGNALFORGE_DROP_SEVERITY}',
              '${env:SIGNALFORGE_HEALTH_ROUTE}',
              '${env:SIGNALFORGE_HEALTH_SERVICE}',
              'path: /var/lib/signalforge/archive/optimized.jsonl',
          ]
          missing = [item for item in required if item not in config]
          if missing:
              raise SystemExit(f"Collector policy/archive config missing: {missing}")
          print("Policy substitutions and optimized archive exporter are configured.")
          PY

      - name: Build Collector image
        run: docker build --file deploy/collector/Dockerfile --tag signalforge-collector:ci .

      - name: Start Collector and verify health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signalforge-archive"
          chmod 777 "$RUNNER_TEMP/signalforge-archive"

          docker run --detach \
            --name signalforge-collector-ci \
            --publish 127.0.0.1:14318:4318 \
            --publish 127.0.0.1:19464:9464 \
            --volume "$RUNNER_TEMP/signalforge-archive:/var/lib/signalforge/archive" \
            signalforge-collector:ci

          for attempt in $(seq 1 45); do
            if docker exec signalforge-collector-ci \
              wget -q -O /dev/null http://127.0.0.1:13133/; then
              echo "Collector health endpoint is responding."
              exit 0
            fi

            if [ "$(docker inspect --format '{{.State.Running}}' signalforge-collector-ci)" != "true" ]; then
              echo "Collector container exited before becoming healthy."
              docker logs signalforge-collector-ci
              exit 1
            fi

            sleep 2
          done

          echo "Collector health endpoint did not become ready in time."
          docker logs signalforge-collector-ci
          exit 1

      - name: Send OTLP log and verify archive
        shell: bash
        run: |
          set -euo pipefail
          marker="SIGNALFORGE-CI-SMOKE-$(date +%s)"
          echo "SMOKE_MARKER=$marker" >> "$GITHUB_ENV"
          payload=$(printf '{"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"signalforge-ci-smoke"}}]},"scopeLogs":[{"scope":{"name":"signalforge-ci"},"logRecords":[{"timeUnixNano":"1760000000000000000","severityText":"INFO","body":{"stringValue":"%s"}}]}]}]}' "$marker")

          response=$(curl --silent --show-error --output "$RUNNER_TEMP/otlp-response.json" \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            http://127.0.0.1:14318/v1/logs)

          if [ "$response" != "200" ]; then
            cat "$RUNNER_TEMP/otlp-response.json"
            echo "OTLP/HTTP returned HTTP $response (expected 200)."
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if grep -R -F -- "$marker" "$RUNNER_TEMP/signalforge-archive"; then
              echo "Smoke-test log was written to the archive."
              exit 0
            fi
            sleep 1
          done

          echo "The OTLP request succeeded, but the marker was not found in the archive."
          find "$RUNNER_TEMP/signalforge-archive" -maxdepth 2 -type f -print
          exit 1

      - name: Verify optimization policy and archive completeness
        shell: bash
        run: |
          set -euo pipefail
          debug_marker="SIGNALFORGE-POLICY-DROP-$(date +%s)"
          info_marker="SIGNALFORGE-POLICY-KEEP-$(date +%s)"
          echo "DEBUG_MARKER=$debug_marker" >> "$GITHUB_ENV"
          echo "INFO_MARKER=$info_marker" >> "$GITHUB_ENV"

          payload=$(printf '{"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"signalforge-policy-test"}}]},"scopeLogs":[{"logRecords":[{"severityText":"DEBUG","body":{"stringValue":"%s"}},{"severityText":"INFO","body":{"stringValue":"%s"}}]}]}]}' "$debug_marker" "$info_marker")
          response=$(curl --silent --show-error --output "$RUNNER_TEMP/policy-response.json" --write-out '%{http_code}' --header 'Content-Type: application/json' --data "$payload" http://127.0.0.1:14318/v1/logs)
          if [ "$response" != "200" ]; then
            cat "$RUNNER_TEMP/policy-response.json"
            echo "Policy test OTLP request returned HTTP $response (expected 200)."
            exit 1
          fi

          for attempt in $(seq 1 30); do
            logs=$(docker logs signalforge-collector-ci 2>&1 || true)
            if printf '%s' "$logs" | grep -F -- "$info_marker" >/dev/null; then
              break
            fi
            sleep 1
          done

          logs=$(docker logs signalforge-collector-ci 2>&1 || true)
          if ! printf '%s' "$logs" | grep -F -- "$info_marker" >/dev/null; then
            echo "Expected INFO marker was not emitted by the optimized pipeline."
            docker logs signalforge-collector-ci
            exit 1
          fi
          if printf '%s' "$logs" | grep -F -- "$debug_marker" >/dev/null; then
            echo "DEBUG marker unexpectedly reached the optimized debug exporter."
            docker logs signalforge-collector-ci
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if grep -F -- "$debug_marker" "$RUNNER_TEMP/signalforge-archive/logs.jsonl" >/dev/null \
              && grep -F -- "$info_marker" "$RUNNER_TEMP/signalforge-archive/logs.jsonl" >/dev/null \
              && grep -F -- "$info_marker" "$RUNNER_TEMP/signalforge-archive/optimized.jsonl" >/dev/null; then
              if grep -F -- "$debug_marker" "$RUNNER_TEMP/signalforge-archive/optimized.jsonl" >/dev/null; then
                echo "DEBUG marker unexpectedly reached the optimized archive."
                exit 1
              fi
              echo "Raw archive retains both records; optimized archive retains INFO and excludes DEBUG."
              exit 0
            fi
            sleep 1
          done

          echo "Raw archive did not contain both policy test records."
          find "$RUNNER_TEMP/signalforge-archive" -maxdepth 2 -type f -print
          exit 1

      - name: Verify optimization count metrics
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            logs=$(docker logs signalforge-collector-ci 2>&1 || true)
            if printf '%s' "$logs" | grep -F 'signalforge.input.log.records' >/dev/null \
              && printf '%s' "$logs" | grep -F 'signalforge.optimized.log.records' >/dev/null; then
              echo "Input and post-optimization record count metrics were emitted."
              exit 0
            fi
            sleep 1
          done

          echo "Expected optimization count metrics were not emitted."
          docker logs signalforge-collector-ci
          exit 1

      - name: Verify Prometheus optimization metrics endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19464/metrics > "$RUNNER_TEMP/signalforge-prometheus-metrics.txt"; then
              break
            fi
            sleep 1
          done

          if ! grep -F 'signalforge_input_log_records' "$RUNNER_TEMP/signalforge-prometheus-metrics.txt" >/dev/null; then
            echo "Input record count metric missing from Prometheus endpoint."
            cat "$RUNNER_TEMP/signalforge-prometheus-metrics.txt"
            exit 1
          fi
          if ! grep -F 'signalforge_optimized_log_records' "$RUNNER_TEMP/signalforge-prometheus-metrics.txt" >/dev/null; then
            echo "Optimized record count metric missing from Prometheus endpoint."
            cat "$RUNNER_TEMP/signalforge-prometheus-metrics.txt"
            exit 1
          fi
          echo "Prometheus endpoint exposes both optimization count metrics."

      - name: Send OTLP trace and metric smoke tests
        shell: bash
        run: |
          set -euo pipefail
          trace_marker="SIGNALFORGE-CI-TRACE-$(date +%s)"
          metric_marker="signalforge_ci_metric_$(date +%s)"
          echo "TRACE_MARKER=$trace_marker" >> "$GITHUB_ENV"
          echo "METRIC_MARKER=$metric_marker" >> "$GITHUB_ENV"

          trace_payload=$(printf '{"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"signalforge-ci-smoke"}}]},"scopeSpans":[{"scope":{"name":"signalforge-ci"},"spans":[{"traceId":"0123456789abcdef0123456789abcdef","spanId":"0123456789abcdef","name":"%s","kind":1,"startTimeUnixNano":"1760000000000000000","endTimeUnixNano":"1760000000001000000"}]}]}]}' "$trace_marker")
          trace_response=$(curl --silent --show-error --output "$RUNNER_TEMP/otlp-traces-response.json" --write-out '%{http_code}' --header 'Content-Type: application/json' --data "$trace_payload" http://127.0.0.1:14318/v1/traces)
          if [ "$trace_response" != "200" ]; then
            cat "$RUNNER_TEMP/otlp-traces-response.json"
            echo "OTLP traces returned HTTP $trace_response (expected 200)."
            exit 1
          fi

          metric_payload=$(printf '{"resourceMetrics":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"signalforge-ci-smoke"}}]},"scopeMetrics":[{"scope":{"name":"signalforge-ci"},"metrics":[{"name":"%s","unit":"1","gauge":{"dataPoints":[{"timeUnixNano":"1760000000001000000","asDouble":1.0}]}}]}]}]}' "$metric_marker")
          metric_response=$(curl --silent --show-error --output "$RUNNER_TEMP/otlp-metrics-response.json" --write-out '%{http_code}' --header 'Content-Type: application/json' --data "$metric_payload" http://127.0.0.1:14318/v1/metrics)
          if [ "$metric_response" != "200" ]; then
            cat "$RUNNER_TEMP/otlp-metrics-response.json"
            echo "OTLP metrics returned HTTP $metric_response (expected 200)."
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if docker logs signalforge-collector-ci 2>&1 | grep -F -- "$trace_marker" >/dev/null \
              && docker logs signalforge-collector-ci 2>&1 | grep -F -- "$metric_marker" >/dev/null; then
              echo "Trace and metric payloads reached their debug pipelines."
              exit 0
            fi
            sleep 1
          done

          echo "OTLP requests were accepted, but debug output markers were not found."
          docker logs signalforge-collector-ci
          exit 1

      - name: Restart Collector and verify archive persists
        shell: bash
        run: |
          set -euo pipefail
          docker restart signalforge-collector-ci

          for attempt in $(seq 1 45); do
            if docker exec signalforge-collector-ci wget -q -O /dev/null http://127.0.0.1:13133/; then
              break
            fi
            sleep 2
          done

          if ! docker exec signalforge-collector-ci wget -q -O /dev/null http://127.0.0.1:13133/; then
            echo "Collector did not become healthy after restart."
            docker logs signalforge-collector-ci
            exit 1
          fi

          if ! grep -R -F -- "$SMOKE_MARKER" "$RUNNER_TEMP/signalforge-archive"; then
            echo "Previously archived marker is missing after restart."
            find "$RUNNER_TEMP/signalforge-archive" -maxdepth 2 -type f -print
            exit 1
          fi
          echo "Archived log persisted across a Collector restart."

      - name: Show Collector logs on failure
        if: failure()
        run: docker logs signalforge-collector-ci || true

      - name: Stop test container
        if: always()
        run: docker rm --force signalforge-collector-ci || true
