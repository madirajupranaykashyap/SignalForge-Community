
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 1s
    send_batch_size: 1024
  filter:
    error_mode: ignore
    log_conditions:
      - 'log.body == "HEALTH_CHECK"'
  memory_limiter/archive:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch/archive:
    timeout: 1s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: detailed
  file/archive:
    path: ./data/archive/logs.jsonl
    append: true
    create_directory: true

service:
  telemetry:
    logs:
      level: debug
    metrics:
      level: detailed
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, filter]
      exporters: [debug]
    # Independent archive output before vendor filtering.
    logs/archive:
      receivers: [otlp]
      processors: [memory_limiter/archive, batch/archive]
      exporters: [file/archive]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
