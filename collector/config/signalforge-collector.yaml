# SignalForge OpenTelemetry Collector configuration.
# Archive every incoming log once. Traces and metrics are currently accepted
# and sent to the debug exporter for validation; persistent archives are logs-only.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:
    timeout: 5s
  filter/drop-noisy:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["http.route"] == "/health"'
        - 'attributes["service.name"] == "health-check"'

exporters:
  debug:
    verbosity: basic
  file/archive:
    path: /var/lib/signalforge/archive/logs.jsonl
    append: true
    create_directory: true

extensions:
  health_check:
    endpoint: "127.0.0.1:13133"

service:
  extensions: [health_check]
  pipelines:
    # Raw archive: all received logs are persisted once, before filtering.
    logs/archive:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/archive]

    # Filtered log stream for local inspection or a future destination.
    logs/filtered:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop-noisy, batch]
      exporters: [debug]

    # Traces and metrics are accepted, processed, and debug-exported.
    # They are not persisted to the logs-only file archive.
    traces/inspection:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

    metrics/inspection:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
