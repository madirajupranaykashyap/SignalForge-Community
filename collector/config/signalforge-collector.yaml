# SignalForge Collector: raw archive, configurable optimized stream, and counts.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:
    timeout: 5s
  filter/optimization:
    error_mode: ignore
    logs:
      log_record:
        - 'severity_text == "${env:SIGNALFORGE_DROP_SEVERITY}"'
        - 'attributes["http.route"] == "${env:SIGNALFORGE_HEALTH_ROUTE}"'
        - 'attributes["service.name"] == "${env:SIGNALFORGE_HEALTH_SERVICE}"'
connectors:
  count/input:
    logs:
      signalforge.input.log.records:
        description: "Log records entering the raw archive pipeline."
  count/optimized:
    logs:
      signalforge.optimized.log.records:
        description: "Log records remaining after optimization policies."
exporters:
  prometheus/optimization:
    endpoint: "0.0.0.0:9464"
    namespace: signalforge
    send_timestamps: true
  debug:
    verbosity: detailed
  file/archive:
    path: /var/lib/signalforge/archive/logs.jsonl
    append: true
    create_directory: true
  file/optimized:
    path: /var/lib/signalforge/archive/optimized.jsonl
    append: true
    create_directory: true
extensions:
  health_check:
    endpoint: "127.0.0.1:13133"
service:
  extensions: [health_check]
  pipelines:
    logs/archive:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/archive, count/input]
    metrics/optimization-input:
      receivers: [count/input]
      exporters: [prometheus/optimization, debug]
    logs/optimized:
      receivers: [otlp]
      processors: [memory_limiter, filter/optimization, batch]
      exporters: [debug, count/optimized, file/optimized]
    metrics/optimization-output:
      receivers: [count/optimized]
      exporters: [prometheus/optimization, debug]
    traces/inspection:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics/inspection:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
