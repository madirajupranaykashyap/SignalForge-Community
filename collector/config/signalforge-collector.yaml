# SignalForge OpenTelemetry Collector configuration.
# Archive every incoming log once. The filtered pipeline is for downstream
# inspection/export and intentionally does not write to the archive.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:
    timeout: 5s
  filter/drop-noisy:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["http.route"] == "/health"'
        - 'attributes["service.name"] == "health-check"'

exporters:
  debug:
    verbosity: basic
  file/archive:
    path: /var/lib/signalforge/archive/logs.jsonl
    create_directory: true
    rotation:
      max_megabytes: 100
      max_days: 7
      max_backups: 10
      localtime: false

extensions:
  health_check:
    endpoint: "127.0.0.1:13133"

service:
  extensions: [health_check]
  pipelines:
    # Raw archive: all received logs are persisted once, before filtering.
    logs/archive:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/archive]

    # Filtered stream: suitable for a future vendor exporter or local debug.
    logs/filtered:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop-noisy, batch]
      exporters: [debug]
